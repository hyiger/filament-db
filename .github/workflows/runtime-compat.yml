name: Runtime compatibility

# GH #1216: the SSRF dispatcher comes from the INSTALLED undici but is handed
# to Node's GLOBAL fetch, i.e. the undici bundled with whatever Node runs the
# server. A major-version mismatch between the two broke every guarded fetch
# on Node 26 while the 20/22 gate stayed green. This job runs the fetch-path
# suites on the runtimes the gate doesn't cover: Node 24 (the runtime Electron
# 41 embeds), Node 26, and `current`: the newest Node RELEASE when it runs, so
# the weekly cron reaches a new Node major (and the undici it bundles) without
# anyone editing this list. Pre-releases don't count; see the setup-node step.
#
# Deliberately NOT part of test.yml / ci-gate.yml and not a required check:
# ci-gate.yml gates release.yml and docker.yml, and neither shipped artifact
# runs Node 26, so a future Node release must not be able to block a tag.
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/lib/externalUrlGuard.ts
      - src/lib/openprinttagBrowser.ts
      # The guarded-fetch callers: a change to how they call fetch (a body, a
      # hand-set header, a new dispatcher) can break the pairing on its own.
      - src/lib/tdsExtractor.ts
      - src/app/api/embed-check/route.ts
      - src/app/api/prusament/route.ts
      - tests/externalUrlGuard.test.ts
      - tests/openprinttagBrowser.test.ts
      - tests/setup.ts
      - vitest.config.ts
      - .github/workflows/runtime-compat.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  fetch-path:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26, current]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          # `current` is this matrix's label, not setup-node's alias of that
          # name: the alias takes the top of nodejs.org/dist/index.json, which
          # also lists Node 27's alpha builds. `*` takes the newest stable row
          # of the actions/node-versions manifest, but only with check-latest;
          # without it `*` stops at the newest Node in the runner's tool cache.
          node-version: ${{ matrix.node-version == 'current' && '*' || matrix.node-version }}
          check-latest: ${{ matrix.node-version == 'current' }}
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: only the fetch path is under test here, so skip
        # the NFC native module build (and its PC/SC headers) and Electron's
        # binary download. mongodb-memory-server fetches mongod on first use.
        run: npm ci --ignore-scripts

      - name: Fetch-path tests
        run: npx vitest run tests/externalUrlGuard.test.ts tests/openprinttagBrowser.test.ts
